services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8000"
    environment:
      - LLAMA_CLOUD_API_KEY=${LLAMA_CLOUD_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_PAGE_MODEL=${OPENAI_PAGE_MODEL:-gpt-5.2}
      - OPENAI_BUNDLE_MODEL=${OPENAI_BUNDLE_MODEL:-gpt-5.2}
      - OPENAI_PAGE_BATCH_SIZE=${OPENAI_PAGE_BATCH_SIZE:-2}
      - OPENAI_PAGE_RENDER_DPI=${OPENAI_PAGE_RENDER_DPI:-144}
      - ARTIFACT_ENCRYPTION_KEY=${ARTIFACT_ENCRYPTION_KEY}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/openapi.json')"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "3000"
    environment:
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    depends_on:
      api:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - api
    restart: unless-stopped
