services:
  mysql:
    image: mysql:8.4
    environment:
      - MYSQL_DATABASE=medical_ai_bot
      - MYSQL_USER=medicalai
      - MYSQL_PASSWORD=medicalai
      - MYSQL_ROOT_PASSWORD=rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-umedicalai", "-pmedicalai"]
      interval: 20s
      timeout: 10s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2026-03-13T11-33-38Z
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 20s
      timeout: 10s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8000"
    environment:
      - LLAMA_CLOUD_API_KEY=${LLAMA_CLOUD_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AI_PROVIDER=${AI_PROVIDER:-openai}
      - OPENAI_PAGE_MODEL=${OPENAI_PAGE_MODEL:-gpt-5.2}
      - OPENAI_BUNDLE_MODEL=${OPENAI_BUNDLE_MODEL:-gpt-5.2}
      - GEMINI_PAGE_MODEL=${GEMINI_PAGE_MODEL:-gemini-2.5-flash-lite}
      - GEMINI_BUNDLE_MODEL=${GEMINI_BUNDLE_MODEL:-gemini-2.5-flash}
      - OPENAI_PAGE_BATCH_SIZE=${OPENAI_PAGE_BATCH_SIZE:-1}
      - OPENAI_PAGE_RENDER_DPI=${OPENAI_PAGE_RENDER_DPI:-300}
      - AI_PAGE_CONCURRENCY=${AI_PAGE_CONCURRENCY:-3}
      - ARTIFACT_ENCRYPTION_KEY=${ARTIFACT_ENCRYPTION_KEY}
      - DATABASE_URL=${DATABASE_URL:-mysql+pymysql://medicalai:medicalai@mysql:3306/medical_ai_bot}
      - LEGACY_JOB_STORAGE_DIR=${LEGACY_JOB_STORAGE_DIR:-storage/jobs}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-http://minio:9000}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-minioadmin}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-medical-ai-vault}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_USE_SSL=${S3_USE_SSL:-false}
      - ALLOW_LOCAL_FALLBACK=${ALLOW_LOCAL_FALLBACK:-false}
      - ENABLE_LEGACY_JOB_IMPORT=${ENABLE_LEGACY_JOB_IMPORT:-true}
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/openapi.json')"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "3000"
    environment:
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    depends_on:
      api:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - api
    restart: unless-stopped

volumes:
  mysql_data:
  minio_data:
